# The full workout library — strength (A/B/C, in `rotation`) and PT routines
# (not in `rotation`; the coach picks between them per directives.md). Most
# already exist as structured workouts on the watch (garmin_workout_id), so
# the agent schedules the existing workout by ID rather than rebuilding it —
# your loaded weights and exact exercise selection are preserved. Edit
# reps/exercises here to keep the agent's understanding in sync, but the
# Garmin workout is the source of truth for what actually lands on the watch.

rotation: [full_body_a, full_body_b, full_body_c]   # cycle in this order

workouts:
  full_body_a:
    label: "Full Body A"
    garmin_workout_id: "1414012813"
    sport: strength_training
    warmup:
      - {name: "Band pull-apart", reps: 20}
      - {name: "Ankle dorsiflexion with band", reps: 10}
      - {name: "Cardio", time_sec: 300}
    blocks:   # each block is done as 3 rounds unless sets given
      - sets: 3
        exercises:
          - {name: "Goblet squat", reps: 12}
          - {name: "Banded pull-ups", reps: 10}
      - sets: 3
        exercises:
          - {name: "Dumbbell bench press", reps: 10}
          - {name: "Straight-arm pulldown", reps: 10}
      - sets: 3
        exercises:
          - {name: "Romanian deadlift", reps: 8}
          - {name: "Cable core press", reps: 10}
      - sets: 3
        exercises:
          - {name: "Standing calf raise", reps: 10}
          - {name: "Leg extension — 90° isometric hold", time_sec: 60}
      - sets: 3
        exercises:
          - {name: "Dead bug", reps: 10}
          - {name: "Farmer's carry", time_sec: 60}

  full_body_b:
    label: "Full Body B"
    garmin_workout_id: "1414015802"
    sport: strength_training
    warmup:
      - {name: "Band pull-apart", reps: 10}
      - {name: "Ankle dorsiflexion with band", reps: 10}
      - {name: "Cardio", time_sec: 300}
    blocks:
      - sets: 3
        exercises:
          - {name: "Banded glute bridge", reps: 10}
          - {name: "Seated dumbbell shoulder press", reps: 8}
      - sets: 3
        exercises:
          - {name: "Lat pulldown", reps: 8}
          - {name: "Seated barbell overhead triceps extension", reps: 10}
      - sets: 3
        exercises:
          - {name: "Single-leg Romanian deadlift with dumbbell", reps: 8}
          - {name: "Leg extension — 60° isometric hold", time_sec: 60}
      - sets: 3
        exercises:
          - {name: "Kneeling rear flye", reps: 12}
          - {name: "Face pull", reps: 10}
      - sets: 3
        exercises:
          - {name: "Cable woodchop", reps: 10}
          - {name: "Good morning", reps: 10}

  full_body_c:
    label: "Full Body C"
    garmin_workout_id: "1414019198"
    sport: strength_training
    warmup:
      - {name: "Band pull-apart", reps: 10}
      - {name: "Ankle dorsiflexion with band", reps: 10}
      - {name: "Cardio", time_sec: 300}
    blocks:
      - sets: 3
        exercises:
          - {name: "Dumbbell step-up", reps: 12}
          - {name: "Push-up", reps: 10}
      - sets: 3
        exercises:
          - {name: "Single-arm dumbbell bench press", reps: 8}
          - {name: "Single-arm neutral-grip dumbbell row", reps: 8}
      - sets: 3
        exercises:
          - {name: "Leg curl", reps: 12}
          - {name: "Barbell biceps curl", reps: 10}
      - sets: 3
        exercises:
          - {name: "Single-leg standing dumbbell calf raise (3s eccentric)", reps: 10}
          - {name: "Leg extension — 90° isometric hold", time_sec: 60}
      - sets: 3
        exercises:
          - {name: "Side plank", time_sec: 30}
          - {name: "Wall slide", reps: 10}
          - {name: "Plank", reps: 10}

  # PT routines for the in-between (non-lifting) days — not in `rotation`
  # above, the coach picks between them per directives.md (home vs gym).
  # Exercises carry tags the agent honors:
  #   priority  — do first, don't drop (lateral ankle pain driver)
  #   skip_on_flare — omit when flare mode / pain elevated
  #   equipment — what's needed (drives the home vs gym choice)
  # The gym variant matches the existing Garmin "PT Routine" (garmin_workout_id);
  # the home variant has no Garmin workout yet (propose-only, or create on demand).
  pt_home:
    label: "PT Day · Home"
    garmin_workout_id: "1625297181"
    sport: mobility
    equipment: [ankle weights, heavy small band, towel, chair, step, mat]
    warmup:
      - {name: "Seated marching + ankle circles", time_sec: 300}
    blocks:
      - group: "A · Tendon + Quad"
        exercises:
          - {name: "Wall sit (shallow, ~60°)", sets: 5, time_sec: 40, tags: [iso_anchor]}
          - {name: "Quad sets", sets: 2, reps: 10}
          - {name: "Short arc quad", sets: 3, reps: 15, equipment: [ankle weights]}
          - {name: "Straight-leg raise", sets: 3, reps: 12, equipment: [ankle weights]}
          - {name: "Step-down", sets: 3, reps: 10, tags: [skip_on_flare]}
      - group: "B · Hip"
        exercises:
          - {name: "Single-leg bridge", sets: 3, reps: 10, equipment: [ankle weights]}
          - {name: "Resisted clamshell", sets: 3, reps: 15, equipment: [heavy small band]}
          - {name: "Lateral band walk", sets: 2, reps: 15, tags: [skip_on_flare], equipment: [band]}
          - {name: "Hip controlled articular rotations", sets: 2, reps: 10, equipment: [ankle weights]}
          - {name: "Glute bridge (double-leg)", sets: 3, reps: 15, equipment: [ankle weights]}
      - group: "C · Ankle"
        exercises:
          - {name: "Seated foot eversion", sets: 3, reps: 15, tags: [priority], equipment: [ankle weights]}
          - {name: "Seated toe raise (dorsiflexion)", sets: 3, reps: 15, equipment: [ankle weights]}
          - {name: "Eccentric calf raise (3s lower)", sets: 3, reps: 12}
          - {name: "Single-leg reach (fwd + back only)", sets: 1, reps: 3}
      - group: "Cool-down"
        exercises:
          - {name: "Hip flexor stretch (kneeling)", sets: 2, time_sec: 45}

  pt_gym:
    label: "PT Day · Gym"
    garmin_workout_id: "1625297182"
    sport: mobility
    equipment: [long band, small band, bike, rower, back extension machine, ladder anchor]
    warmup:
      - {name: "Seated bike, low resistance", time_sec: 480}
    blocks:
      - group: "A · Tendon + Quad"
        exercises:
          - {name: "Wall sit (shallow, ~60°)", sets: 5, time_sec: 40, tags: [iso_anchor]}
          - {name: "Spanish squat (long band)", sets: 5, time_sec: 40, tags: [iso_anchor], equipment: [long band]}
          - {name: "Quad sets", sets: 2, reps: 10}
          - {name: "Terminal knee extension", sets: 3, reps: 15, equipment: [long band]}
          - {name: "Straight-leg raise", sets: 3, reps: 12}
          - {name: "Step-down", sets: 3, reps: 10, tags: [skip_on_flare]}
      - group: "B · Hip"
        exercises:
          - {name: "Single-leg bridge", sets: 3, reps: 10}
          - {name: "Resisted side-plank clamshell", sets: 3, reps: 10, equipment: [small band]}
          - {name: "Hip controlled articular rotations", sets: 2, reps: 10}
          - {name: "Back extension", sets: 3, reps: 12, equipment: [back extension machine]}
      - group: "C · Ankle"
        exercises:
          - {name: "Banded eversion", sets: 3, reps: 15, tags: [priority], equipment: [small band]}
          - {name: "Banded dorsiflexion", sets: 3, reps: 15, equipment: [small band]}
          - {name: "Eccentric calf raise (3s lower)", sets: 3, reps: 12}
          - {name: "Single-leg reach (fwd + back only)", sets: 1, reps: 3}
          - {name: "Lateral band walk", sets: 2, reps: 15, tags: [skip_on_flare], equipment: [band]}
      - group: "Cool-down"
        exercises:
          - {name: "Hip flexor stretch (kneeling)", sets: 2, time_sec: 45}
      - group: "Cardio"
        exercises:
          - {name: "Bike (high seat) or rower (knee <90°), Zone 2", time_sec: 900}
